kind = "web"
previewPath = "/"
title = "Multi-Toolbox"
description = "A browser-first toolbox for image and PDF processing, unit conversion, and everyday calculators. Designed for fast, private, practical use without paid APIs."
version = "1.0.0"
id = "artifacts/multi-toolbox"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18925

[services.development]
run = "pnpm --filter @workspace/multi-toolbox run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/multi-toolbox", "run", "build" ]
serve = "static"
publicDir = "artifacts/multi-toolbox/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18925"
BASE_PATH = "/"
